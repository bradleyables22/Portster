name: Release Windows executables

on:
  push:
    branches:
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: Create the calendar version
        shell: pwsh
        run: |
          $now = [DateTime]::UtcNow
          $dateTag = $now.ToString('yyyy.MM.dd')
          $buildVersion = "$($now.Year).$($now.Month).$($now.Day)"
          $shortCommit = $env:GITHUB_SHA.Substring(0, 7)
          $releaseTag = "v$dateTag.$env:GITHUB_RUN_NUMBER"

          "PORTSTER_RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "PORTSTER_VERSION=$buildVersion" >> $env:GITHUB_ENV
          "PORTSTER_INFORMATIONAL_VERSION=$buildVersion.$env:GITHUB_RUN_NUMBER+sha.$shortCommit" >> $env:GITHUB_ENV
          "Release: $releaseTag" >> $env:GITHUB_STEP_SUMMARY
          "Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY

      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore Portster.slnx
          dotnet test Portster.slnx -c Release --no-restore

      - name: Publish and package Windows executables
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release'
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null

          foreach ($rid in @('win-x64', 'win-arm64')) {
            $publishDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\$rid"
            dotnet publish Server/Server.csproj `
              -c Release `
              -r $rid `
              --self-contained true `
              --no-restore `
              -p:Version=$env:PORTSTER_VERSION `
              -p:InformationalVersion=$env:PORTSTER_INFORMATIONAL_VERSION `
              -o $publishDirectory

            $archive = Join-Path $releaseDirectory "portster-$rid.zip"
            Compress-Archive -Path "$publishDirectory\*" -DestinationPath $archive
          }

          Get-ChildItem -LiteralPath $releaseDirectory -Filter '*.zip' |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash *$($_.Name)"
            } |
            Set-Content -LiteralPath (Join-Path $releaseDirectory 'SHA256SUMS') -Encoding ascii

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/release/*.zip

      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArguments = @(
            'release', 'create', $env:PORTSTER_RELEASE_TAG,
            'artifacts/release/portster-win-x64.zip',
            'artifacts/release/portster-win-arm64.zip',
            'artifacts/release/SHA256SUMS',
            '--target', '${{ github.sha }}',
            '--generate-notes',
            '--latest',
            '--title', "Portster $env:PORTSTER_RELEASE_TAG",
            '--notes', "Automated build from master commit ${{ github.sha }}."
          )

          gh @releaseArguments
